<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; script-src 'self'; connect-src 'self';" />
  <title>垂直摄像头工作室</title>
  <link rel="stylesheet" href="vendor/cropper.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>垂直摄像头工作室</h1>
    </div>

    <div class="topbar-right">
      <label class="field">
        <span>摄像头</span>
        <select id="deviceSelect" title="选择摄像头设备"></select>
      </label>
      <button id="btnRefreshDevices" class="btn ghost" title="重新扫描设备">刷新</button>
      <span id="camStatus" class="status-chip">未启动</span>
      <button id="btnSettings" class="btn ghost" title="打开独立设置窗口">设置…</button>
      <div class="window-controls" role="group" aria-label="窗口控制">
        <button id="btnMinimize" class="btn ghost win-btn" title="最小化">－</button>
        <button id="btnMaximize" class="btn ghost win-btn" title="最大化">□</button>
        <button id="btnClose" class="btn ghost win-btn close" title="关闭">×</button>
      </div>
    </div>
  </header>

  <main class="panes" id="panes">
    <!-- 左：摄像头实时预览 -->
    <section class="pane" id="previewPane">
      <button id="btnRailPreview" class="pane-rail" title="展开实时预览" data-stat="railPreview">
        <span class="rail-arrow">›</span>
        <span class="rail-text">实时预览</span>
      </button>
      <h2 class="pane-title">实时预览</h2>
      <div id="previewStage" class="preview-stage">
        <div id="previewRot" class="preview-rot">
          <video id="video" playsinline muted autoplay></video>
        </div>
        <div id="previewPlaceholder" class="placeholder">点击「刷新」选择摄像头</div>
      </div>

      <div class="pane-tools">
        <div class="group" role="group" aria-label="旋转校正">
          <span class="group-label">物理旋转校正</span>
          <button class="btn rot" data-rot="0">0°</button>
          <button class="btn rot" data-rot="90">90°</button>
          <button class="btn rot" data-rot="180">180°</button>
          <button class="btn rot" data-rot="270">270°</button>
        </div>

        <div class="group">
          <span class="group-label">画面</span>
          <button id="btnMirror" class="btn">镜像</button>
          <button id="btnShot" class="btn primary" title="快捷键：空格">拍照</button>
          <button id="btnScreenShot" class="btn" title="截取鼠标所在显示器（多屏时先把鼠标移到目标屏幕）">屏幕截图</button>
          <label class="btn" for="fileInput" data-stat="importImage" title="导入本地图片进行裁剪">导入图片</label>
          <input id="fileInput" type="file" accept="image/*" hidden />
        </div>
      </div>
    </section>

    <!-- 右：裁剪工作台 -->
    <section class="pane collapsed" id="editPane">
      <button id="btnRailEdit" class="pane-rail" title="展开裁剪工作台" data-stat="railEdit">
        <span class="rail-text">裁剪 / 缩放 / 旋转</span>
        <span class="rail-arrow">‹</span>
      </button>
      <div class="pane-heading">
        <h2 class="pane-title">裁剪 / 缩放 / 旋转</h2>
        <div id="modeBadge" class="mode-badge select" data-stat="modeBadge" data-tip="点击徽标固定模式（截取/拖动切换）；按住 Ctrl 临时切到另一种模式，松开回到固定模式。拖选区边角控制点可微调大小。">✂ 截取模式</div>
      </div>

      <div id="cropStage" class="crop-stage">
        <img id="cropImage" alt="待裁剪画面" />
        <div id="cropEmpty" class="placeholder">还没有画面，先拍照或截图</div>
      </div>

      <div class="crop-tools">
        <div class="group">
          <span class="group-label">选区</span>
          <button id="btnZoomReset" class="btn ghost" title="复位并适应窗口">复位</button>
        </div>

        <div class="group">
          <span class="group-label">缩放</span>
          <button id="btnZoomOut" class="btn">－</button>
          <button id="btnZoomIn" class="btn">＋</button>
        </div>

        <div class="group">
          <span class="group-label">旋转</span>
          <button id="btnRotL" class="btn">↺ 90°</button>
          <button id="btnRotR" class="btn">↻ 90°</button>
          <button id="btnFlipH" class="btn">水平翻转</button>
        </div>

        <div class="group">
          <span class="group-label">比例</span>
          <select id="aspectSelect">
            <option value="free">自由</option>
            <option value="16:9">16:9</option>
            <option value="4:3">4:3</option>
            <option value="3:4">3:4</option>
            <option value="1:1">1:1</option>
            <option value="original">原图</option>
          </select>
          <button id="btnOpenFolder" class="btn ghost" title="打开输出目录">打开</button>
          <button id="btnSave" class="btn primary" title="快捷键：Ctrl+S">保存裁剪结果</button>
          <button id="btnRecapture" class="btn">重新拍摄</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="statusbar">
    <span id="statusText">就绪</span>
    <span id="appInfo" class="muted"></span>
  </footer>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/cropper.min.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
